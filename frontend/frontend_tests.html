<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseFit — Vue 3 Frontend AI Benchmark Runner</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/styles.css">
    <style>
        .test-wrapper {
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
        }
        .test-card {
            background: rgba(18, 25, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .test-card.passed { border-left: 4px solid #10b981; }
        .test-card.failed { border-left: 4px solid var(--red-accent); }
        .test-title { font-weight: 600; font-size: 0.95rem; }
        .test-detail { font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
        .test-badge { font-weight: 800; font-size: 0.85rem; padding: 4px 10px; border-radius: 6px; }
        .badge-passed { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .badge-failed { background: rgba(239, 68, 68, 0.2); color: var(--red-accent); }
    </style>
</head>
<body>
    <div class="test-wrapper glass-panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <div>
                <h2>Vue 3 Frontend AI Benchmark Runner</h2>
                <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 4px;">
                    Evaluates Compile-Time & Runtime Error Corrections in Vue 3 Templates & JS
                </p>
            </div>
            <button id="btn-run" class="btn btn-primary">▶ Run Vue Tests</button>
        </div>

        <div id="results-list"></div>

        <div style="margin-top: 24px; text-align: center;">
            <a href="index.html" style="color: var(--orange-accent); text-decoration: underline; font-size: 0.9rem;">
                &larr; Return to PulseFit Dashboard
            </a>
        </div>
    </div>

    <script src="frontend_tests.js"></script>
    <script>
        const runBtn = document.getElementById("btn-run");
        const listEl = document.getElementById("results-list");

        async function execute() {
            const results = await window.VueTestSuite.runAll();
            listEl.innerHTML = "";
            results.forEach(res => {
                const card = document.createElement("div");
                card.className = `test-card ${res.passed ? 'passed' : 'failed'}`;
                card.innerHTML = `
                    <div>
                        <div class="test-title">${res.description}</div>
                        ${res.details ? `<div class="test-detail">${res.details}</div>` : ''}
                    </div>
                    <span class="test-badge ${res.passed ? 'badge-passed' : 'badge-failed'}">
                        ${res.passed ? 'PASS' : 'FAIL'}
                    </span>
                `;
                listEl.appendChild(card);
            });
        }

        runBtn.addEventListener("click", execute);
        if (document.readyState === 'loading') {
    document.addEventListener("DOMContentLoaded", execute);
} else {
    execute();
}
    </script>
</body>
</html>
